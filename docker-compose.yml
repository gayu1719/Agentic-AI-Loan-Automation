version: '3.8'

services:
  agentic-los:
    build: .
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://cloud.langfuse.com}
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/agentic_los
      - VECTOR_STORE_PATH=/app/vector_store
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DEBUG=${DEBUG:-False}
    volumes:
      - ./rules:/app/rules:ro
      - ./uploads:/app/uploads
      - vector_store:/app/vector_store
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - agentic-los-network

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=agentic_los
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - agentic-los-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - agentic-los-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - agentic-los
    restart: unless-stopped
    networks:
      - agentic-los-network

volumes:
  postgres_data:
  redis_data:
  vector_store:

networks:
  agentic-los-network:
    driver: bridge 